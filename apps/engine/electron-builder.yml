# 마디 엔진 패키징. `pnpm --filter @madi/engine package` (먼저 web 빌드 + engine 빌드 + 사이드카).
appId: dev.madi.engine
productName: madi-engine
copyright: madi
artifactName: madi-engine-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# esbuild 번들 하나 + 네이티브 모듈. 나머지 의존성은 번들 안에 있다.
files:
  - dist/**
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# 엔진이 MADI_ROOT=process.resourcesPath 아래에서 찾는 것들
extraResources:
  - from: resources/web
    to: web
  - from: resources/drizzle
    to: drizzle
  - from: ../../resources/fonts
    to: fonts
  - from: dist/mcp.mjs
    to: mcp.mjs
  - from: build/tray.png
    to: tray.png
  - from: build/trayTemplate.png
    to: trayTemplate.png

win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: ../../resources/bin/win32-x64
      to: bin/win32-x64
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.video
  target:
    # pkg: 받은 파일을 열면 설치 마법사 → /Applications → 끝나면 바로 실행 (build/pkg-scripts/postinstall).
    # dmg 처럼 끌어다 놓는 단계가 없다. zip 은 electron-updater 용.
    - target: pkg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 서명·공증은 아직 없다 (Apple Developer 계정 없음). 받은 pkg 를 처음 열 때
  # "확인할 수 없음" 이 뜨면 시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기.
  identity: null
  hardenedRuntime: false
  extraResources:
    - from: ../../resources/bin/darwin-${arch}
      to: bin/darwin-${arch}
pkg:
  installLocation: /Applications
  allowAnywhere: false
  allowCurrentUserHome: false
  allowRootDirectory: true
  isRelocatable: false
  overwriteAction: upgrade
  # build/ 는 생성물(.gitignore)이라 스크립트는 pkg-scripts/ 에 둔다 (buildResources 기준 상대 경로)
  scripts: ../pkg-scripts

# 자동 업데이트: GitHub Releases (공개 저장소라 토큰 없이 받는다)
# 릴리스 워크플로가 draft 를 먼저 만들고, 세 플랫폼 빌드가 여기에 올린 뒤 마지막에 draft 를 푼다.
publish:
  provider: github
  owner: monandoll
  repo: madi
  releaseType: draft
