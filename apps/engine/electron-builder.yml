# 마디 엔진 패키징. `pnpm --filter @madi/engine package` (먼저 web 빌드 + engine 빌드 + 사이드카).
appId: dev.madi.engine
productName: madi-engine
copyright: madi
artifactName: madi-engine-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# esbuild 번들 하나 + 네이티브 모듈. 나머지 의존성은 번들 안에 있다.
files:
  - dist/**
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# 엔진이 MADI_ROOT=process.resourcesPath 아래에서 찾는 것들
extraResources:
  - from: resources/web
    to: web
  - from: resources/drizzle
    to: drizzle
  - from: ../../resources/fonts
    to: fonts
  - from: dist/mcp.mjs
    to: mcp.mjs
  - from: build/tray.png
    to: tray.png
  - from: build/trayTemplate.png
    to: trayTemplate.png

# 아키텍처는 설정에 적지 않는다: 릴리스 워크플로가 러너마다 `electron-builder --win nsis --x64` 처럼 CLI 로 준다.
# 설정에 arch 목록을 두면 CLI --arm64 를 줘도 목록대로 두 아키텍처를 다 만든다 (사이드카 없는 빌드 + pkg 임시 파일 충돌).
win:
  target:
    - target: nsis
  extraResources:
    - from: ../../resources/bin/win32-x64
      to: bin/win32-x64
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.video
  target:
    # pkg: 받은 파일을 열면 설치 마법사 → /Applications → 끝나면 바로 실행 (pkg-scripts/postinstall).
    # dmg 처럼 끌어다 놓는 단계가 없다. zip 은 electron-updater 용.
    - target: pkg
    - target: zip
  # 서명·공증: 릴리스 워크플로가 secrets(MAC_CERT_P12 · APPLE_ID …)가 있을 때만 CSC_LINK / APPLE_* 환경변수를 준다.
  # 없으면 CSC_IDENTITY_AUTO_DISCOVERY=false 로 서명 없이 만든다 → 받은 pkg 를 처음 열 때 "확인할 수 없음"
  # (시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기). docs/packaging.md "서명" 참고.
  # 서명할 때는 앱 안의 실행 파일(사이드카·네이티브 모듈)까지 같은 권한으로 서명하고, pkg 는 Developer ID Installer 로 서명한 뒤 공증한다.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extraResources:
    - from: ../../resources/bin/darwin-${arch}
      to: bin/darwin-${arch}
pkg:
  installLocation: /Applications
  allowAnywhere: false
  allowCurrentUserHome: false
  allowRootDirectory: true
  isRelocatable: false
  overwriteAction: upgrade
  # build/ 는 생성물(.gitignore)이라 스크립트는 pkg-scripts/ 에 둔다 (buildResources 기준 상대 경로)
  scripts: ../pkg-scripts

# 자동 업데이트: GitHub Releases (공개 저장소라 토큰 없이 받는다)
# 릴리스 워크플로가 draft 를 먼저 만들고, 세 플랫폼 빌드가 여기에 올린 뒤 마지막에 draft 를 푼다.
publish:
  provider: github
  owner: monandoll
  repo: madi
  releaseType: draft
