name: Release

# v* 태그를 푸시하면 Windows·macOS 설치 파일을 만들어 GitHub Release 에 올린다.
#   prepare  → 태그 이름으로 draft Release 를 먼저 만든다 (세 빌드가 동시에 만들려다 부딪히지 않게)
#   build    → 플랫폼별 설치 파일을 만들어 그 draft 에 올린다 (electron-builder publish, releaseType: draft)
#   publish  → macOS 두 아키텍처의 latest-mac.yml 을 하나로 합쳐 올리고 draft 를 푼다 → 설치 페이지가 바로 집어간다
# workflow_dispatch: tag 를 주면 —
#   · 그 태그가 없으면 이 워크플로를 돌린 커밋(보통 main)에 태그를 찍고(git ref API) Release 를 만든다 (태그를 따로 푸시할 필요 없음).
#     apps/engine/package.json 의 version 과 태그가 맞지 않으면 멈춘다.
#   · 이미 있으면 그 태그의 코드를 main 의 이 워크플로로 다시 빌드해 같은 Release 에 올린다 (재시도용).
#   비우면 Release 없이 아티팩트만 남긴다 (설정 점검용).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v0.2.0). 없는 태그면 이 커밋에 새로 찍는다. 비우면 아티팩트만'
        required: false
        default: ''

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
  WHISPER_VERSION: v1.7.6

permissions:
  contents: write

jobs:
  prepare:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 태그가 아직 없을 수 있으니 (dispatch 로 새 릴리스) 워크플로를 돌린 커밋을 받는다.
      - uses: actions/checkout@v4
      - name: Create draft release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          # 1) 태그. 없으면 이 커밋에 찍는다 (draft Release 의 --target 은 공개할 때까지 태그를 만들지 않아서 build 의 checkout 이 실패한다 → ref 를 직접 만든다).
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "tag $TAG exists"
          else
            VERSION="v$(node -p "require('./apps/engine/package.json').version")"
            if [ "$VERSION" != "$TAG" ]; then
              echo "apps/engine/package.json 의 version($VERSION) 과 태그($TAG) 가 다릅니다. 먼저 version 을 맞추세요."
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            echo "tag $TAG → $GITHUB_SHA"
          fi
          # 2) Release. 없으면 draft 로 만든다.
          if gh release view "$TAG" --json isDraft > /dev/null 2>&1; then
            echo "release $TAG exists"
            # GitHub 웹에서 "Publish release" 로 만든 릴리스는 이미 공개 상태 → electron-builder(releaseType: draft) 가
            # "existing type not compatible" 로 업로드를 건너뛴다. 빌드 동안만 draft 로 돌려 두고 publish 잡이 다시 푼다.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false" ]; then
              gh release edit "$TAG" --draft
              echo "release $TAG → draft (빌드 동안)"
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "마디 $TAG" \
              --notes "설치: https://monandoll.github.io/madi/ (PC 에서 열고 설치 버튼)"
          fi

  build:
    name: ${{ matrix.label }}
    needs: prepare
    # workflow_dispatch 에서는 prepare 가 skipped → 그래도 빌드는 한다
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MAC_SIGNED: ${{ secrets.MAC_CERT_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # targets: 러너마다 자기 아키텍처만. 설정 파일에는 arch 를 두지 않는다 (electron-builder.yml 주석 참고).
          - os: windows-latest
            label: windows x64
            platform: win32-x64
            targets: --win nsis --x64
          - os: macos-14
            label: macOS arm64
            platform: darwin-arm64
            targets: --mac pkg zip --arm64
          - os: macos-15-intel
            label: macOS x64
            platform: darwin-x64
            targets: --mac pkg zip --x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch sidecars (ffmpeg, cloudflared, whisper on Windows, fonts)
        run: node scripts/fetch-sidecars.mjs --platform ${{ matrix.platform }}

      # macOS 의 whisper-cli 는 릴리스 바이너리가 없어서 소스로 (정적, Metal)
      - name: Build whisper-cli (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 -b "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp /tmp/whisper
          cmake -S /tmp/whisper -B /tmp/whisper/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper/build --config Release -j "$(sysctl -n hw.ncpu)" --target whisper-cli
          cp /tmp/whisper/build/bin/whisper-cli resources/bin/${{ matrix.platform }}/whisper-cli
          resources/bin/${{ matrix.platform }}/whisper-cli --help > /dev/null

      - name: Typecheck & unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build web + engine
        run: pnpm build

      # 이 러너의 아키텍처만 (--arm64 만 주면 설정의 target 목록을 타서 두 아키텍처를 다 만든다 → target 도 CLI 로).
      # 서명·공증은 secrets 가 있을 때만 (docs/packaging.md "서명"). 없으면 서명 없이 만든다 — 처음 열 때 경고가 뜬다.
      #   macOS: MAC_CERT_P12(base64 .p12, Developer ID Application + Installer) · MAC_CERT_PASSWORD · APPLE_ID · APPLE_APP_SPECIFIC_PASSWORD · APPLE_TEAM_ID
      #   Windows: WIN_CERT_PFX(base64 .pfx) · WIN_CERT_PASSWORD
      # electron-builder 는 빈 CSC_LINK 도 값으로 보므로, 있는 것만 환경변수로 내보낸다.
      - name: Signing env (only from secrets that exist)
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          put() { { echo "$1<<__MADI_EOF__"; echo "$2"; echo "__MADI_EOF__"; } >> "$GITHUB_ENV"; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CERT_P12" ]; then
              put CSC_LINK "$MAC_CERT_P12"; put CSC_KEY_PASSWORD "$MAC_CERT_PASSWORD"; echo "mac: signing on"
            else
              put CSC_IDENTITY_AUTO_DISCOVERY false; echo "mac: no certificate → unsigned build"
            fi
            if [ -n "$APPLE_ID" ]; then
              put APPLE_ID "$APPLE_ID"; put APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"; put APPLE_TEAM_ID "$APPLE_TEAM_ID"; echo "mac: notarization on"
            else
              echo "mac: no Apple ID → not notarized"
            fi
          elif [ -n "$WIN_CERT_PFX" ]; then
            put WIN_CSC_LINK "$WIN_CERT_PFX"; put WIN_CSC_KEY_PASSWORD "$WIN_CERT_PASSWORD"; echo "windows: signing on"
          else
            echo "windows: no certificate → unsigned build"
          fi

      - name: Package (upload to draft Release on tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        run: pnpm --filter @madi/engine exec electron-builder ${{ matrix.targets }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 서명했으면 Gatekeeper 가 실제로 받아 주는지 본다 ("accepted source=Notarized Developer ID" 가 아니면 실패).
      - name: Verify signature & notarization (macOS, when signed)
        if: runner.os == 'macOS' && env.MAC_SIGNED == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
        run: |
          set -e
          for f in apps/engine/release/*.pkg; do
            echo "== $f"
            pkgutil --check-signature "$f"
            spctl -a -vv -t install "$f" 2>&1 | tee /tmp/spctl.txt
            grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          done

      - name: Package (artifact only)
        if: "!(startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')"
        run: pnpm --filter @madi/engine exec electron-builder ${{ matrix.targets }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: madi-engine-${{ matrix.platform }}
          path: |
            apps/engine/release/*.exe
            apps/engine/release/*.pkg
            apps/engine/release/*.zip
            apps/engine/release/*.yml
            apps/engine/release/*.blockmap
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: madi-engine-darwin-*
          path: dl
      - name: Merge latest-mac.yml (arm64 + x64) and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          mapfile -t YMLS < <(find dl -name latest-mac.yml | sort)
          echo "merging: ${YMLS[*]}"
          node apps/engine/scripts/merge-latest-mac.mjs "${YMLS[@]}" > latest-mac.yml
          cat latest-mac.yml
          gh release upload "$TAG" latest-mac.yml --clobber
      - name: Check assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          for want in -win-x64.exe -mac-arm64.pkg -mac-x64.pkg -mac-arm64.zip -mac-x64.zip latest.yml latest-mac.yml; do
            grep -q -- "$want" assets.txt || { echo "missing asset: $want"; exit 1; }
          done
          gh release edit "$TAG" --draft=false --latest
