name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  WHISPER_VERSION: v1.7.6

jobs:
  check:
    name: typecheck · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web + engine bundle
        run: pnpm build

      # 패키징 설정이 깨지지 않았는지: 리눅스 unpacked 빌드만 (배포 타깃은 win/mac)
      - name: electron-builder smoke (linux --dir)
        run: node scripts/fetch-sidecars.mjs --only fonts && pnpm --filter @madi/engine exec electron-builder --linux dir --publish never
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 자막 e2e 용 whisper.cpp — 빌드와 tiny 모델은 캐시한다
      - name: Cache whisper.cpp
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/whisper/bin/whisper-cli
            ~/whisper/models/ggml-tiny.bin
          # 정적 빌드(공유 라이브러리 없이 바이너리 하나) — 캐시에서 복원해도 그대로 돈다
          key: whisper-${{ runner.os }}-${{ env.WHISPER_VERSION }}-static-tiny

      - name: Build whisper.cpp
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp ~/whisper/src
          cmake -S ~/whisper/src -B ~/whisper/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build ~/whisper/build --config Release -j "$(nproc)" --target whisper-cli
          mkdir -p ~/whisper/bin ~/whisper/models
          cp ~/whisper/build/bin/whisper-cli ~/whisper/bin/whisper-cli
          ldd ~/whisper/bin/whisper-cli | grep -E 'whisper|ggml' && { echo 'whisper-cli still links shared ggml/whisper libs'; exit 1; } || true
          curl -sSL -o ~/whisper/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Check whisper-cli runs
        run: ~/whisper/bin/whisper-cli --help > /dev/null

      - name: E2E (engine + browser)
        run: pnpm e2e
        env:
          MADI_WHISPER: /home/runner/whisper/bin/whisper-cli
          MADI_WHISPER_MODEL: /home/runner/whisper/models/ggml-tiny.bin

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
