# Madi.xcodeproj 의 원본. `xcodegen generate` 로 프로젝트 파일을 만든다.
#
# 왜 생성하나: .xcodeproj 는 diff 가 읽히지 않아서 "왜 이 설정이 이렇게 됐나"를 추적할 수 없다.
# 여기를 고치고 생성하면 설정 변경이 커밋에 사람이 읽을 수 있는 형태로 남는다.
# 생성된 Madi.xcodeproj 도 같이 커밋하므로 xcodegen 없이도 열고 빌드할 수 있다.

name: Madi
options:
  bundleIdPrefix: app.madi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # AGENTS.md §17 — Universal 2. 개발 머신과 크리에이터 머신이 다르다.
    ARCHS: arm64 x86_64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # 코어. 모델 · 템플릿 · 렌더가 전부 여기 있다.
  # 앱 · 스파이크 CLI · 테스트가 같은 코드를 쓴다 (AGENTS.md §7 프리뷰와 최종 렌더가 같은 코드).
  MadiKit:
    type: framework
    platform: macOS
    sources:
      - path: Madi/Model
      - path: Madi/Render
      - path: Madi/Templates
      - path: Madi/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.kit
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DEFINES_MODULE: YES

  # 0단계의 프리뷰 창 하나. 본 UI 는 6단계다 (docs/stage-0.spec.md 범위 밖).
  Madi:
    type: application
    platform: macOS
    sources:
      - path: Madi/App
    dependencies:
      - target: MadiKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.Madi
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"

  # 측정 루프용. `still` 로 자막 한 장을 PNG 로 뽑고 tools/measure.mjs 로 잰다.
  # 빌드 산출물 디렉토리에 MadiKit.framework 가 나란히 놓이므로 @executable_path 로 찾는다.
  MadiSpike:
    type: tool
    platform: macOS
    sources:
      - path: MadiSpike
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: madi-spike
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"

  MadiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MadiTests
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  Madi:
    build:
      targets:
        Madi: all
        MadiSpike: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MadiTests
  MadiSpike:
    build:
      targets:
        MadiSpike: all
    run:
      config: Debug
