# Madi.xcodeproj 의 원본. `xcodegen generate` 로 프로젝트 파일을 만든다.
#
# 왜 생성하나: .xcodeproj 는 diff 가 읽히지 않아서 "왜 이 설정이 이렇게 됐나"를 추적할 수 없다.
# 여기를 고치고 생성하면 설정 변경이 커밋에 사람이 읽을 수 있는 형태로 남는다.
# 생성된 Madi.xcodeproj 도 같이 커밋하므로 xcodegen 없이도 열고 빌드할 수 있다.

name: Madi
options:
  bundleIdPrefix: app.madi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # AGENTS.md §17 — Universal 2. 개발 머신과 크리에이터 머신이 다르다.
    ARCHS: arm64 x86_64
    ONLY_ACTIVE_ARCH: NO
    # ⚠ Debug 는 현재 아키텍처만 빌드한다.
    #   WhisperKit 패키지가 Universal 빌드에서 arm64 모듈만 내놓아 x86_64 슬라이스가 깨진다.
    #   §17 은 Tier 2(Intel)에서 WhisperKit 대신 whisper.cpp 를 쓰기로 이미 정해 뒀으므로,
    #   제대로 된 해법은 3단계에서 `TranscriptionProvider` 를 아키텍처별로 가르는 것이다.
    #   Release·Universal 은 그때까지 미해결이다 (`docs/findings/2026-09-26-whisperkit.md §2`).
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

packages:
  # 전사. word 단위 타임스탬프가 필수라 이걸 고른다 (AGENTS.md §3).
  # Intel 폴백(whisper.cpp)은 3단계에서 붙인다 — 지금은 Apple Silicon 경로만.
  # ⚠ 0.9 대에 고정한다. 0.18 은 Vapor(웹 서버) · swift-openapi 까지 끌고 오는데
  #   §16 이 "웹 UI · HTTP 서버" 를 하지 않기로 했고, Universal 빌드도 깨진다
  #   (`docs/findings/2026-09-26-whisperkit.md §2`).
  # ★ exactVersion 이다. minorVersion 은 0.9.x 범위라 고정이 아니고,
  #   Package.resolved 는 .gitignore(project.xcworkspace/)에 막혀 커밋되지 않는다.
  #   즉 여기 적힌 값이 **레포에 남는 유일한 버전 기록**이다.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 0.9.4

targets:
  # 코어. 모델 · 템플릿 · 렌더가 전부 여기 있다.
  # 앱 · 스파이크 CLI · 테스트가 같은 코드를 쓴다 (AGENTS.md §7 프리뷰와 최종 렌더가 같은 코드).
  MadiKit:
    type: framework
    platform: macOS
    sources:
      - path: Madi/Model
      - path: Madi/Analyze
      - path: Madi/Render
      - path: Madi/Review
      - path: Madi/Templates
      - path: Madi/Templates/Spec.json
        buildPhase: resources
      - path: Madi/Resources/Fonts
        buildPhase: resources
      # 폴더 참조로 넣어야 번들 안에서 styles/short.v1.json 경로가 유지된다.
      - path: Madi/Resources/styles
        buildPhase: resources
        type: folder
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.kit
        GENERATE_INFOPLIST_FILE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DEFINES_MODULE: YES

  # 0단계의 프리뷰 창 하나. 본 UI 는 6단계다 (docs/stage-0.spec.md 범위 밖).
  Madi:
    type: application
    platform: macOS
    sources:
      - path: Madi/App
    dependencies:
      - target: MadiKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.Madi
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"

  # 측정 루프용. `still` 로 자막 한 장을 PNG 로 뽑고 tools/measure.mjs 로 잰다.
  # 빌드 산출물 디렉토리에 MadiKit.framework 가 나란히 놓이므로 @executable_path 로 찾는다.
  MadiSpike:
    type: tool
    platform: macOS
    sources:
      - path: MadiSpike
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: madi-spike
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"

  MadiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MadiTests
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.tests
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  Madi:
    build:
      targets:
        Madi: all
        MadiSpike: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MadiTests
  MadiSpike:
    build:
      targets:
        MadiSpike: all
    run:
      config: Debug
