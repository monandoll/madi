# Madi.xcodeproj 의 원본. `xcodegen generate` 로 프로젝트 파일을 만든다.
#
# 왜 생성하나: .xcodeproj 는 diff 가 읽히지 않아서 "왜 이 설정이 이렇게 됐나"를 추적할 수 없다.
# 여기를 고치고 생성하면 설정 변경이 커밋에 사람이 읽을 수 있는 형태로 남는다.
# 생성된 Madi.xcodeproj 도 같이 커밋하므로 xcodegen 없이도 열고 빌드할 수 있다.

name: Madi
options:
  bundleIdPrefix: app.madi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # AGENTS.md §17 — Universal 2. 개발 머신과 크리에이터 머신이 다르다.
    ARCHS: arm64 x86_64
    ONLY_ACTIVE_ARCH: NO
    # ⚠ Debug 는 현재 아키텍처만 빌드한다.
    #   WhisperKit 패키지가 Universal 빌드에서 arm64 모듈만 내놓아 x86_64 슬라이스가 깨진다.
    #   Universal 앱은 `scripts/build-universal.sh` 로 만든다 — 아키텍처마다 따로 빌드해 lipo 로 합친다
    #   (docs/stage-3.spec.md 결정 ③ A). 아키텍처마다 따로 가면 WhisperKit 도 둘 다 빌드된다.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # 판 번호 (Sparkle 이 비교한다). 올리는 법은 scripts/release.sh.
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

packages:
  # 전사 (Apple Silicon). word 단위 타임스탬프가 필수라 이걸 고른다 (AGENTS.md §3).
  # Intel 은 WhisperKit 이 전사 중 죽어서 whisper.cpp 를 쓴다 — 아래 WhisperCpp 패키지.
  # 엔진은 런타임에 TranscriptionEngine.forThisMachine 한 곳에서 고른다 (docs/stage-3.spec.md 결정 ④ B).
  # ⚠ 0.9 대에 고정한다. 0.18 은 Vapor(웹 서버) · swift-openapi 까지 끌고 오는데
  #   §16 이 "웹 UI · HTTP 서버" 를 하지 않기로 했고, Universal 빌드도 깨진다
  #   (`docs/findings/2026-09-26-whisperkit.md §2`).
  # ★ exactVersion 이다. minorVersion 은 0.9.x 범위라 고정이 아니다.
  #   의존성의 의존성까지는 Package.resolved 가 고정한다 (2026-09-27 부터 커밋한다).
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 0.9.4
  # 저장소 (AGENTS.md §3 — SwiftData 쓰지 않는다). 마이그레이션 · 관측 쿼리.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  # 자동 업데이트 (AGENTS.md §2 배포 · docs/stage-6.spec.md 4번). 판 고정.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Intel 전사 — whisper.cpp 공식 xcframework. 주소 · 체크섬은 Packages/WhisperCpp/Package.swift 에.
  WhisperCpp:
    path: Packages/WhisperCpp

targets:
  # 코어. 모델 · 템플릿 · 렌더가 전부 여기 있다.
  # 앱 · 스파이크 CLI · 테스트가 같은 코드를 쓴다 (AGENTS.md §7 프리뷰와 최종 렌더가 같은 코드).
  MadiKit:
    type: framework
    platform: macOS
    sources:
      - path: Madi/Model
      - path: Madi/Analyze
      - path: Madi/Render
      - path: Madi/Review
      - path: Madi/Templates
      - path: Madi/Store
      - path: Madi/Queue
      - path: Madi/Import
      - path: Madi/Downloads
      - path: Madi/MCP
      - path: Madi/Agent
        excludes: ["*.md"]
      - path: Madi/Export
      - path: Madi/Resources/downloads.json
        buildPhase: resources
      - path: Madi/Templates/Spec.json
        buildPhase: resources
      # AI 제작 지침 (AGENTS.md §10 컨텍스트 1번). PromptAssembler 가 읽는다.
      - path: Madi/Agent/playbook.md
        buildPhase: resources
      - path: Madi/Resources/Fonts
        buildPhase: resources
      # 폴더 참조로 넣어야 번들 안에서 styles/short.v1.json 경로가 유지된다.
      - path: Madi/Resources/styles
        buildPhase: resources
        type: folder
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: GRDB
        product: GRDB
      - package: WhisperCpp
        product: WhisperCpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.kit
        GENERATE_INFOPLIST_FILE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DEFINES_MODULE: YES

  # 0단계의 프리뷰 창 하나. 본 UI 는 6단계다 (docs/stage-0.spec.md 범위 밖).
  Madi:
    type: application
    platform: macOS
    # Sparkle 이 읽는 칸 (INFOPLIST_KEY_ 로 못 넣는 키). 생성되는 Info.plist 와 합쳐진다.
    info:
      path: Madi/App/Info.plist
      properties:
        # 새 판 목록 — **업데이트 전용 공개 레포** 의 최신 릴리스. 소스 레포(monandoll/madi)에는 전작 v0.2 릴리스가
        # Latest 로 걸려 있어 섞이면 안 된다 (docs/stage-6.spec.md 결정)
        SUFeedURL: https://github.com/monandoll/madi-releases/releases/latest/download/appcast.xml
        # 업데이트 서명 검증 키 (EdDSA). 비밀 키는 만든 Mac 의 키체인(계정 madi)에만 있다
        SUPublicEDKey: pwBJBDEFPFnk/T8UQRiv+6QDgaqrfc+nvKlv4AOaqhQ=
        # 하루 한 번 알아서 확인한다 — 크리에이터는 "업데이트 있음" 알림과 버튼만 본다 (§2)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    sources:
      - path: Madi/App
      # 디자인 AI 가 만드는 화면 (docs/prompts/design-ai.md). 아직 앱 창에 붙지 않았고
      # `#Preview` 로만 본다. 붙이는 것은 6단계다.
      # `UI/Snapshot` 은 스크린샷 CLI 의 `main.swift` 라 앱 타깃에 들어가면 안 된다.
      - path: Madi/UI
        excludes:
          - "Snapshot/**"
    dependencies:
      - target: MadiKit
        embed: true
      # MadiKit 이 링크하는 동적 프레임워크는 **앱이** 넣어야 한다. 빠지면 켜지자마자 죽는다.
      - package: WhisperCpp
        product: WhisperCpp
      # AI CLI 가 띄우는 MCP 서버 (docs/stage-4.spec.md 결정 ①). Contents/MacOS/madi-mcp —
      # 앱과 같은 Frameworks 를 쓴다. build-universal.sh 가 번들 안 Mach-O 를 전부 합치므로 따로 할 일 없다.
      - target: MadiMCP
        embed: true
        copy:
          destination: executables
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.Madi
        # 앱 아이콘 — Madi/UI/Assets.xcassets (디자인 쪽. 다시 그리려면 docs/design/icon/make-icon.swift)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 강조색 = Tokens.Palette.accent (#2D6A55). 없으면 사이드바 아이콘 · 고른 칸이 시스템 강조색(사람마다 다름)을 따른다.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # 사진 보관함 권한 (§2). 문장은 디자인 쪽이 다듬는다 — docs/design/copy-keys.md `photoLibraryUsage`
        # Hardened Runtime 에서 사진 보관함을 읽는 권한 (docs/stage-6.spec.md 3번).
        CODE_SIGN_ENTITLEMENTS: Madi/App/Madi.entitlements
        # 문장은 Copy.Photos.photoLibraryUsage 를 그대로 옮긴 것이다 (Info.plist 라 Copy 로는 안 닿는다). 바뀌면 같이 고친다.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "아이폰으로 찍은 영상을 옮기지 않고 바로 편집하려고 사진 보관함을 읽어요. 영상은 이 Mac을 떠나지 않아요."
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"

  # 측정 루프용. `still` 로 자막 한 장을 PNG 로 뽑고 tools/measure.mjs 로 잰다.
  # 빌드 산출물 디렉토리에 MadiKit.framework 가 나란히 놓이므로 @executable_path 로 찾는다.
  MadiSpike:
    type: tool
    platform: macOS
    sources:
      - path: MadiSpike
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: madi-spike
        LD_RUNPATH_SEARCH_PATHS: "@executable_path"

  # AI CLI(claude · codex)가 자식 프로세스로 띄우는 MCP stdio 서버. 도구 2개 (AGENTS.md §10).
  # 앱 번들에서는 Contents/MacOS 에, 빌드 산출물 디렉토리에서는 MadiKit.framework 옆에 놓인다.
  MadiMCP:
    type: tool
    platform: macOS
    sources:
      - path: MadiMCP
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        PRODUCT_NAME: madi-mcp
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path"

  # 화면 스크린샷용. `#Preview` 를 눈으로 보는 것과 별개로, 확정된 화면은 PNG 로 남겨야
  # 사람이 확인하고 커밋에 붙일 수 있다 (docs/prompts/design-ai.md).
  # 창을 1440×900 과 1100×700 로 띄워 그대로 떠서 `docs/design/screens/` 에 쓴다.
  MadiUIShots:
    type: tool
    platform: macOS
    sources:
      # 아이콘 카탈로그는 앱 것이다. 명령줄 도구는 번들이 없어 카탈로그를 담을 곳이 없다.
      - path: Madi/UI
        excludes:
          - "Assets.xcassets"
    settings:
      base:
        PRODUCT_NAME: madi-ui-shots
        # 앱이 아니라 CLI 라서 @main 대신 main.swift 를 쓴다.
        SWIFT_VERSION: "6.0"

  # 바꾸는 층(엔진 → ViewData) 테스트. 앱을 띄우지 않는다 — 띄우면 파이프라인이 켜져 사진 보관함 · DB 를 건드린다.
  # 그래서 바꾸는 층과 ViewData · Copy · Tokens 파일만 여기에 같이 컴파일한다 (docs/stage-6.spec.md 6번).
  MadiBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MadiBridgeTests
      - path: Madi/App/Bridge
      - path: Madi/UI/ViewData.swift
      - path: Madi/UI/UIAction.swift
      - path: Madi/UI/Copy.swift
      - path: Madi/UI/Tokens.swift
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.bridgetests
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"

  MadiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MadiTests
    dependencies:
      - target: MadiKit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.madi.tests
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  Madi:
    build:
      targets:
        Madi: all
        MadiSpike: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MadiTests
        - MadiBridgeTests
  MadiSpike:
    build:
      targets:
        MadiSpike: all
    run:
      config: Debug
  MadiUIShots:
    build:
      targets:
        MadiUIShots: all
    run:
      config: Debug
