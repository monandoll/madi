<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
body{margin:0;background:#E7E4DF;font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;color:#1F1D1A;-webkit-font-smoothing:antialiased}
a{color:#2D6A55;text-decoration:none}a:hover{color:#23574A}
</style>
</helmet>

<section style="padding:64px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-size:26px;font-weight:700;letter-spacing:-0.02em">4단계 · 첫 실행 · 설정</div>
    <div style="font-size:14px;color:#5E5952">첫 실행 <a href="#4a">4a</a>–<a href="#4h">4h</a> (4a부터 끝까지 눌러서 진행돼요) · 설정 <a href="#4i">4i</a> <a href="#4j">4j</a> <a href="#4k">4k</a></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="font-size:15px;font-weight:700">첫 실행 · 720×540 고정 창</div>
    <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;max-width:2320px">
      <div id="4a" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4a</span><span style="font-size:14px;color:#5E5952">1 / 3 사진 접근 · 처음</span></div><dc-import name="Onboarding" hint-size="720px,540px"></dc-import></div>
      <div id="4b" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4b</span><span style="font-size:14px;color:#5E5952">macOS 허용 창</span></div><dc-import name="Onboarding" photo="asking" hint-size="720px,540px"></dc-import></div>
      <div id="4c" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4c</span><span style="font-size:14px;color:#5E5952">허용 안 함 · 그래도 계속 가능</span></div><dc-import name="Onboarding" photo="denied" hint-size="720px,540px"></dc-import></div>
      <div id="4d" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4d</span><span style="font-size:14px;color:#5E5952">2 / 3 AI 고르기</span></div><dc-import name="Onboarding" step="{{ 2 }}" hint-size="720px,540px"></dc-import></div>
      <div id="4e" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4e</span><span style="font-size:14px;color:#5E5952">로그인 기다리는 중</span></div><dc-import name="Onboarding" step="{{ 2 }}" ai-state="waiting" hint-size="720px,540px"></dc-import></div>
      <div id="4f" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4f</span><span style="font-size:14px;color:#5E5952">연결됨</span></div><dc-import name="Onboarding" step="{{ 2 }}" ai-state="connected" hint-size="720px,540px"></dc-import></div>
      <div id="4g" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4g</span><span style="font-size:14px;color:#5E5952">3 / 3 스튜디오 이름</span></div><dc-import name="Onboarding" step="{{ 3 }}" hint-size="720px,540px"></dc-import></div>
      <div id="4h" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4h</span><span style="font-size:14px;color:#5E5952">준비됐어요 → 갤러리 빈 상태(1b)로</span></div><dc-import name="Onboarding" step="{{ 4 }}" hint-size="720px,540px"></dc-import></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="font-size:15px;font-weight:700">설정 · 1440×900</div>
    <div style="display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start">
      <div id="4i" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4i</span><span style="font-size:14px;color:#5E5952">연결됨 · 보관 기간·쓰는 AI 메뉴 눌러보세요</span></div><dc-import name="Settings" hint-size="1440px,900px"></dc-import></div>
      <div id="4j" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4j</span><span style="font-size:14px;color:#5E5952">빈 상태 · AI·사진 연결 안 됨</span></div><dc-import name="Settings" mode="empty" hint-size="1440px,900px"></dc-import></div>
      <div id="4k" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:700;background:#1F1D1A;color:#fff;padding:3px 8px;border-radius:999px">4k</span><span style="font-size:14px;color:#5E5952">불러오는 중 · 연결 확인</span></div><dc-import name="Settings" mode="loading" hint-size="1440px,900px"></dc-import></div>
    </div>
  </div>
</section>
</x-dc>
</body>
</html>
