<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:232px;height:100%;box-sizing:border-box;padding:8px 0 8px 8px;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard Variable',Pretendard,sans-serif;color:#1F1D1A">
  <div style="height:100%;box-sizing:border-box;background:#EFEDEA;border:0.5px solid #D6D2CB;border-radius:14px;display:flex;flex-direction:column">
    <div style="height:44px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 14px"><span style="width:12px;height:12px;border-radius:50%;background:#FF5F57;border:0.5px solid #E0443E"></span><span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;border:0.5px solid #DEA123"></span><span style="width:12px;height:12px;border-radius:50%;background:#28C840;border:0.5px solid #1AAB29"></span></div>
    <div style="padding:0 8px;display:flex;flex-direction:column;gap:1px">
      <div style="font-size:11px;font-weight:600;color:#8E8880;padding:8px 8px 4px">보관함</div>
      <div style="height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:8px;font-size:13px;background:{{ shotsBg }}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2D6A55" stroke-width="1.4"><rect x="1.8" y="3.2" width="12.4" height="9.6" rx="2"></rect><path d="M6.6 6.2v3.6L9.8 8z" fill="#2D6A55" stroke="none"></path></svg>
        <span style="flex:1">촬영본</span><span style="font-size:12px;color:#8E8880;font-variant-numeric:tabular-nums">{{ shotsCount }}</span></div>
      <div style="height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:8px;font-size:13px;background:{{ resultsBg }}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2D6A55" stroke-width="1.4"><rect x="3.2" y="1.8" width="9.6" height="12.4" rx="2"></rect><path d="m6.5 10 1.3 1.3 2.4-2.6"></path></svg>
        <span style="flex:1">결과물</span><span style="font-size:12px;color:#8E8880;font-variant-numeric:tabular-nums">{{ resultsCount }}</span></div>
      <div style="height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:8px;font-size:13px;background:{{ makingBg }}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2D6A55" stroke-width="1.4"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.8V8l2.2 1.4"></path></svg>
        <span style="flex:1">만드는 중</span>
        <sc-if value="{{ hasMaking }}"><span style="font-size:12px;color:#8E8880">{{ makingCount }}</span></sc-if>
      </div>
    </div>
    <div style="margin-top:auto;padding:10px 16px 14px;display:flex;align-items:center;gap:8px">
      <span style="width:7px;height:7px;border-radius:50%;background:{{ aiDot }};flex-shrink:0"></span>
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:12px;font-weight:600">{{ studio }}</span><span style="font-size:11px;color:#78726A">{{ aiText }}</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shots&quot;,&quot;results&quot;,&quot;making&quot;],&quot;default&quot;:&quot;shots&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ai&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;off&quot;,&quot;checking&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;makingCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;shotsCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;},&quot;resultsCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:31,&quot;tsType&quot;:&quot;number&quot;},&quot;studio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;바른몸 스튜디오&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'shots', ai = this.props.ai ?? 'ok', mc = this.props.makingCount ?? 0;
    const bg = k => (a === k ? 'rgba(31,29,26,.09)' : 'transparent');
    return {
      shotsBg: bg('shots'), resultsBg: bg('results'), makingBg: bg('making'),
      shotsCount: this.props.shotsCount ?? 24, resultsCount: this.props.resultsCount ?? 31,
      makingCount: mc, hasMaking: mc > 0, studio: this.props.studio ?? '바른몸 스튜디오',
      aiText: { ok: 'Claude 연결됨', off: 'AI 연결 안 됨', checking: '연결 확인 중' }[ai],
      aiDot: { ok: '#4E9A73', off: '#D6D2CB', checking: '#C98A2B' }[ai],
    };
  }
}
</script>
</body>
</html>
